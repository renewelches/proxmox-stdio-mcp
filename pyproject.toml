[project]
name = "proxmox-mcp"
version = "0.1.0"
description = "STDIO-based MCP Server for the Proxmox VE API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "proxmoxer>=2.3.0",
    "requests>=2.28.0",
]

[project.scripts]
proxmox-mcp = "proxmox_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proxmox_mcp"]

[tool.uv]
python-preference = "only-managed"
