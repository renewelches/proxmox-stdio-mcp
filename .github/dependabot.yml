version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    groups:
      # One PR for all minor/patch bumps instead of one per package;
      # major bumps still get their own PR.
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
